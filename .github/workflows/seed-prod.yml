name: Seed Prod
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type SEED to confirm prod re-seed (apaga e recria todos os dados de demo)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  seed:
    if: ${{ inputs.confirm == 'SEED' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci --workspaces --include-workspace-root
      - run: npm run -w src/lib build
      - run: npm run -w src/back prisma:generate
      - name: Run seed against prod
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: npm run -w src/back seed
