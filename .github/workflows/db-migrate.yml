name: DB Migrate Prod
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type MIGRATE to confirm prod migration'
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    if: ${{ inputs.confirm == 'MIGRATE' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci --workspaces --include-workspace-root
      - run: npm run -w src/lib build
      - run: npm run -w src/back prisma:generate
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: npm run -w src/back prisma:migrate:deploy
