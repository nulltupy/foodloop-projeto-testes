name: Keep Alive
on:
  schedule:
    # A cada 10 min entre 20h-02h UTC (17h-23h BR)
    - cron: '*/10 20-23,0-2 * * *'
  workflow_dispatch: {}

permissions: {}

# Set the `BACK_HEALTH_URL` repo variable (Settings → Secrets and variables →
# Actions → Variables) to the deployed back's /health endpoint once it exists.
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping back health endpoint
        env:
          URL: ${{ vars.BACK_HEALTH_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "Health URL not configured yet — skipping. Set BACK_HEALTH_URL repo variable when the back is deployed."
            exit 0
          fi
          curl -fsSL "$URL"
