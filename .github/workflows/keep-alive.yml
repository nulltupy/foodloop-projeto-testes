name: Keep Alive
on:
  schedule:
    # A cada 10 min na janela 20:00-02:00 UTC (17h-23h BR), horário do piloto.
    # Três expressões em vez de uma faixa 0-2 porque `0-2` rodaria até 02:50;
    # aqui o último disparo é 02:00 em ponto, sem gastar minutos fora da janela.
    - cron: '*/10 20-23 * * *' # 20:00-23:50 UTC (17h-20h50 BR)
    - cron: '*/10 0-1 * * *' # 00:00-01:50 UTC (21h-22h50 BR)
    - cron: '0 2 * * *' # 02:00 UTC em ponto (23h BR), fecho da janela
  workflow_dispatch: {}

permissions: {}

# Por padrão pinga o back de produção; defina a variável de repositório
# BACK_HEALTH_URL (Settings -> Secrets and variables -> Actions -> Variables)
# para apontar para outro ambiente sem alterar este arquivo.
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping back health endpoint
        env:
          URL: ${{ vars.BACK_HEALTH_URL || 'https://foodloop-back.onrender.com/health' }}
        # --retry cobre o cold start do free tier do Render: a primeira resposta
        # pode demorar ou vir 502/503 enquanto o serviço acorda. Com o retry o
        # histórico mostra 200 OK consistente em vez de falhas intermitentes.
        run: curl -fsSL --max-time 60 --retry 5 --retry-delay 15 --retry-all-errors "$URL"
