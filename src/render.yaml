# Blueprint do back em Render Web Service Free.
#
# Render lê este arquivo quando um Blueprint é criado pelo painel. autoDeploy:
# false porque os deploys vão via hook do CI (.github/workflows/deploy-back.yml),
# o que dá controle de quando o serviço acorda do free tier sleep.
#
# As 3 envVars com `sync: false` precisam ser preenchidas no painel do Render
# após criar o serviço:
#   - DATABASE_URL: URL do Neon (sa-east-1), com ?sslmode=require
#   - JWT_SECRET: gerar com `openssl rand -base64 32`
#   - FRONT_URL: URL do front (https://foodloop-front.onrender.com) — definir após o primeiro deploy do front
#
# region: oregon é a única opção free do Render. O RTT BR↔US-East/West é a maior
# fonte de latência no MVP (refletido no SLO de p95 ≤ 1200ms no login).
services:
  - type: web
    name: foodloop-back
    runtime: node
    plan: free
    region: oregon
    autoDeploy: false
    healthCheckPath: /health
    # --include=dev força a instalação de devDependencies (tsc, prisma CLI),
    # necessárias pra build. Sem isso, NODE_ENV=production faz npm pular devDeps
    # e o build quebra. O `node_modules` final fica maior, mas o free tier não
    # cobra por isso e o startCommand só usa o `dist/` compilado.
    buildCommand: npm ci --include=dev && npm run -w src/lib build && npm run -w src/back build
    startCommand: npm run -w src/back start
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONT_URL
        sync: false

  # Static site do front. Static sites são globalmente distribuídos (CDN), não
  # têm cold start, não aceitam `region:` e não aceitam `plan:` (são sempre
  # gratuitos — `plan: free` causa "no such plan free for service type web" no
  # Blueprint sync). As envVars VITE_* são lidas pelo Vite no buildCommand e
  # inlinadas no bundle — não são segredos (qualquer visitante vê o VITE_API_URL
  # no JS).
  - type: web
    name: foodloop-front
    runtime: static
    branch: main
    # autoDeployTrigger:commit substitui o `autoDeploy: true` (deprecated). Cada
    # commit no `branch` dispara build, restrito pelo `buildFilter` abaixo para
    # evitar rebuild em mudanças que não afetam o front.
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - src/front/**
        - src/lib/**
        - src/render.yaml
        - package.json
        - package-lock.json
    # --include=dev força devDependencies (vite, tsc, @vitejs/plugin-react).
    # Mesmo motivo do back: Render roda npm ci com NODE_ENV=production por padrão.
    buildCommand: npm ci --include=dev && npm run -w src/lib build && npm run -w src/front build
    staticPublishPath: ./src/front/dist
    envVars:
      - key: VITE_API_URL
        value: https://foodloop-back.onrender.com
      - key: VITE_USE_MSW
        value: 'false'
    # SPA fallback: qualquer rota não-arquivo cai em /index.html para o React
    # Router resolver client-side. Render só aplica a regra quando NÃO existe
    # um asset no path — então /assets/foo.js continua sendo servido direto.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
