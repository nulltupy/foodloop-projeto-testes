<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodLoop - Novo Anúncio</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Georgia&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="app-header">
    <button class="btn-back" aria-label="Voltar" onclick="history.back()">←</button>
    <h1 class="logo">FoodLoop</h1>
    <div style="width: 24px;"></div>
  </header>

  <main class="container">
    <div id="alert-box" class="alert hidden" role="alert"></div>

    <section class="card">
      <h2 class="card-title">Nova Oferta</h2>
      <p class="card-subtitle">Anuncie um excedente e evite o desperdício.</p>

      <form id="anuncio-form" novalidate>
        
        <div class="input-group">
          <label for="produto">Produto</label>
          <select id="produto" name="produto" required>
            <option value="" disabled selected>Selecione o que sobrou...</option>
            <option value="1" data-preco="12.50">Marmita de Frango e Batata</option>
            <option value="2" data-preco="15.00">Combo de Salgados Sortidos</option>
            <option value="3" data-preco="8.00">Suco Natural de Limão 500ml</option>
          </select>
        </div>

        <div id="pricing-section">
          <div class="price-reference">
            <span>Preço Original:</span>
            <span id="display-preco-regular" class="text-serif">R$ 0,00</span>
          </div>

          <label>Aplicar Desconto Rápido:</label>
          <div class="discount-buttons">
            <button type="button" class="btn-discount" data-discount="0.30">-30%</button>
            <button type="button" class="btn-discount" data-discount="0.50">-50%</button>
            <button type="button" class="btn-discount" data-discount="0.70">-70%</button>
          </div>

          <div class="input-row">
            <div class="input-group half">
              <label for="preco_promocional">Novo Preço (R$)</label>
              <input type="number" id="preco_promocional" name="preco_promocional" step="0.01" min="0.01" placeholder="Ex: 6.25" required>
            </div>
            <div class="input-group half">
              <label for="quantidade">Quantidade Disp.</label>
              <input type="number" id="quantidade" name="quantidade" min="1" value="1" required>
            </div>
          </div>
          <small id="price-error" class="error-text hidden">O preço promocional deve ser menor que o original (R$ <span id="error-preco-orig">0,00</span>).</small>
        </div>

        <div class="input-group" style="margin-top: 16px;">
          <label for="prazo_retirada">Prazo Limite para Retirada</label>
          <input type="datetime-local" id="prazo_retirada" name="prazo_retirada" required>
        </div>

        <button type="submit" id="btn-submit" class="btn-primary" disabled>Publicar Anúncio</button>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
