<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodLoop - Meus Produtos</title>
  
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Georgia&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="app-header">
    <button class="btn-back" onclick="history.back()" aria-label="Voltar">←</button>
    <h1 class="logo">FoodLoop</h1>
    <button id="btn-novo-produto" class="btn-add-header">+ Novo</button>
  </header>

  <main class="container">
    <div id="empty-state" class="empty-container hidden">
      <div class="empty-icon">📦</div>
      <h2 class="card-title" style="color: var(--color-primary-card)">Nenhum produto ainda</h2>
      <p class="empty-text">Cadastre os itens da sua lanchonete para começar a criar ofertas.</p>
      <button id="btn-empty-cta" class="btn-primary">Cadastrar primeiro produto</button>
    </div>

    <div id="products-grid" class="grid-layout">
      </div>
  </main>

  <dialog id="product-dialog" aria-modal="true">
    <div class="modal-content">
      <h2 id="modal-title" class="card-title">Novo Produto</h2>
      <form id="product-form" novalidate>
        <input type="hidden" id="product-id">
        
        <div class="input-group">
          <label for="nome">Nome do Produto</label>
          <input type="text" id="nome" name="nome" placeholder="Ex: Coxinha de Frango" required>
          <small class="error-msg hidden" id="err-nome">O nome é obrigatório.</small>
        </div>

        <div class="input-group">
          <label for="descricao">Descrição</label>
          <textarea id="descricao" name="descricao" rows="2" placeholder="Ex: Massa de batata com recheio desfiado" required></textarea>
        </div>

        <div class="input-row">
          <div class="input-group half">
            <label for="preco_regular">Preço Regular (R$)</label>
            <input type="number" id="preco_regular" name="preco_regular" step="0.01" min="0.10" placeholder="0.00" required>
            <small class="error-msg hidden" id="err-preco">Valor inválido.</small>
          </div>
          <div class="input-group half">
            <label for="categoria">Categoria</label>
            <select id="categoria" name="categoria" required>
              <option value="Lanches">Lanches</option>
              <option value="Bebidas">Bebidas</option>
              <option value="Sobremesa">Sobremesa</option>
              <option value="Padaria">Padaria</option>
              <option value="Outros">Outros</option>
            </select>
          </div>
        </div>

        <div class="modal-actions">
          <button type="submit" class="btn-primary">Salvar</button>
          <button type="button" id="btn-close-modal" class="btn-secondary">Cancelar</button>
        </div>
      </form>
    </div>
  </dialog>

  <dialog id="confirm-dialog" aria-modal="true">
    <div class="modal-content text-center">
      <h2 class="card-title">Desativar Item?</h2>
      <p style="margin-bottom: 20px; font-size: 14px;">Este produto não poderá ser selecionado para novos anúncios até ser reativado.</p>
      <div class="modal-actions">
        <button id="btn-confirm-deactivate" class="btn-danger">Sim, desativar</button>
        <button id="btn-close-confirm" class="btn-secondary">Voltar</button>
      </div>
    </div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
