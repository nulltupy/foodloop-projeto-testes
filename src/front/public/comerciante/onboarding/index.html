<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodLoop - Cadastro de Estabelecimento</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Georgia&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="app-header">
    <h1 class="logo">FoodLoop</h1>
  </header>

  <main class="container">
    <div id="alert-box" class="alert hidden" role="alert" aria-live="assertive"></div>

    <section id="form-section" class="card">
      <h2 class="card-title">Seu Estabelecimento</h2>
      <p class="card-subtitle">Preencha o endereço de retirada dos pedidos.</p>
      
      <form id="onboarding-form" novalidate>
        <div class="input-group">
          <label for="cep">CEP</label>
          <input type="text" id="cep" name="cep" maxlength="9" placeholder="00000-000" required>
        </div>

        <div class="input-group">
          <label for="rua">Rua / Logradouro</label>
          <input type="text" id="rua" name="rua" required>
        </div>

        <div class="input-row">
          <div class="input-group half">
            <label for="numero">Número</label>
            <input type="text" id="numero" name="numero" required>
          </div>
          <div class="input-group half">
            <label for="complemento">Complemento</label>
            <input type="text" id="complemento" name="complemento" placeholder="Opcional">
          </div>
        </div>

        <div class="input-group">
          <label for="bairro">Bairro</label>
          <input type="text" id="bairro" name="bairro" required>
        </div>

        <div class="input-row">
          <div class="input-group col-70">
            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" name="cidade" required>
          </div>
          <div class="input-group col-30">
            <label for="estado">UF</label>
            <input type="text" id="estado" name="estado" maxlength="2" required>
          </div>
        </div>

        <button type="submit" id="btn-submit" class="btn-primary">Avançar</button>
      </form>
    </section>

    <section id="confirmation-section" class="card hidden">
      <h2 class="card-title">Confirme sua localização</h2>
      <p class="card-subtitle">O GPS localizou o seguinte endereço para a sua loja. Está correto?</p>
      
      <div id="endereco-normalizado" class="address-box">
        </div>

      <button type="button" id="btn-confirm" class="btn-primary">Sim, concluir cadastro</button>
      <button type="button" id="btn-edit" class="btn-secondary">Não é aqui? Editar endereço</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
